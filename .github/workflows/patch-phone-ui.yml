'''

          if 'const countries = [' not in text:
              text = text.replace('const features = [', countries + '\nconst features = [', 1)

          state = '  const [country, setCountry] = useState(countries.find((item) => item.code === "TR") ?? countries[0]);\n'
          if 'const [country, setCountry]' not in text:
              text = text.replace('  const [phone, setPhone] = useState("");\n', '  const [phone, setPhone] = useState("");\n' + state, 1)

          old_fn = re.search(r'  async function sendCode\(event:React\.FormEvent\)\{.*?\n  \}', text, re.S)
          new_fn = '''  async function sendCode(event:React.FormEvent){ event.preventDefault(); setError(""); const local = phone.replace(/\\D/g, ""); const normalized = normalizePhone(country.dial + local); if(!/^\\+[1-9]\\d{7,14}$/.test(normalized)){setError("اكتب رقم الهاتف بالشكل الصحيح.");return;} setBusy(true); try{confirmation.current=await signInWithPhoneNumber(auth,normalized,setupRecaptcha());setPhone(local);setStep("code");}catch(err){console.error(err);setError("تعذر إرسال رمز التحقق. تحقق من إعدادات Firebase ونطاق الموقع.");window.recaptchaVerifier?.clear();window.recaptchaVerifier=undefined;}finally{setBusy(false);} }'''
          if not old_fn:
              raise SystemExit('sendCode function not found')
          text = text[:old_fn.start()] + new_fn + text[old_fn.end():]

          old_label = '<label><span>رقم الهاتف</span><input dir="ltr" type="tel" inputMode="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+90 5XX XXX XX XX" autoComplete="tel" required/></label>'
          new_label = '''<label><span>رقم الهاتف</span><div className="phone-picker"><select aria-label="الدولة" value={country.code} onChange={(e)=>setCountry(countries.find((item)=>item.code===e.target.value)??countries[0])}>{countries.map((item)=><option key={item.code} value={item.code}>{item.flag} {item.name} ({item.dial})</option>)}</select><input dir="ltr" type="tel" inputMode="tel" value={phone} onChange={e=>setPhone(e.target.value.replace(/\\D/g,""))} placeholder="5XX XXX XX XX" autoComplete="tel" required/></div></label>'''
          if old_label not in text:
              raise SystemExit('phone label not found')
          text = text.replace(old_label, new_label, 1)

          path.write_text(text, encoding='utf-8')
          PY

          cat >> app/white-theme.css <<'CSS'

          .phone-picker{display:grid;grid-template-columns:minmax(190px,.9fr) 1.1fr;gap:8px;direction:ltr}
          .phone-picker select{width:100%;min-width:0;padding:13px 12px;border-radius:14px;border:1px solid #dfe6e3;background:#f7faf8;color:#15211e;font-weight:700;cursor:pointer}
          .phone-picker input{min-width:0!important;padding-right:14px!important}
          .auth-form label:has(.phone-picker)::after{display:none!important}
          @media (max-width:560px){.phone-picker{grid-template-columns:1fr}.phone-picker select{order:0}.phone-picker input{order:1}}
          CSS

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/white-theme.css
          git rm .github/workflows/patch-phone-ui.yml
          git commit -m "Add WhatsApp-style country phone picker [skip-phone-ui]"
