name: Apply live phone country picker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-phone-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch app/page.tsx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          countries = '''const countries = [
            { code: "US", name: "United States", dial: "+1", flag: "🇺🇸" },
            { code: "CA", name: "Canada", dial: "+1", flag: "🇨🇦" },
            { code: "GB", name: "United Kingdom", dial: "+44", flag: "🇬🇧" },
            { code: "TR", name: "Türkiye", dial: "+90", flag: "🇹🇷" },
            { code: "SY", name: "Syria", dial: "+963", flag: "🇸🇾" },
            { code: "SA", name: "Saudi Arabia", dial: "+966", flag: "🇸🇦" },
            { code: "AE", name: "United Arab Emirates", dial: "+971", flag: "🇦🇪" },
            { code: "IQ", name: "Iraq", dial: "+964", flag: "🇮🇶" },
            { code: "JO", name: "Jordan", dial: "+962", flag: "🇯🇴" },
            { code: "LB", name: "Lebanon", dial: "+961", flag: "🇱🇧" },
            { code: "EG", name: "Egypt", dial: "+20", flag: "🇪🇬" },
            { code: "DE", name: "Germany", dial: "+49", flag: "🇩🇪" },
            { code: "FR", name: "France", dial: "+33", flag: "🇫🇷" },
            { code: "IT", name: "Italy", dial: "+39", flag: "🇮🇹" },
            { code: "ES", name: "Spain", dial: "+34", flag: "🇪🇸" },
            { code: "NL", name: "Netherlands", dial: "+31", flag: "🇳🇱" },
            { code: "CH", name: "Switzerland", dial: "+41", flag: "🇨🇭" },
            { code: "SE", name: "Sweden", dial: "+46", flag: "🇸🇪" },
            { code: "NO", name: "Norway", dial: "+47", flag: "🇳🇴" },
            { code: "GR", name: "Greece", dial: "+30", flag: "🇬🇷" },
            { code: "UA", name: "Ukraine", dial: "+380", flag: "🇺🇦" },
            { code: "RU", name: "Russia", dial: "+7", flag: "🇷🇺" },
            { code: "IN", name: "India", dial: "+91", flag: "🇮🇳" },
            { code: "PK", name: "Pakistan", dial: "+92", flag: "🇵🇰" },
            { code: "CN", name: "China", dial: "+86", flag: "🇨🇳" },
            { code: "JP", name: "Japan", dial: "+81", flag: "🇯🇵" },
            { code: "KR", name: "South Korea", dial: "+82", flag: "🇰🇷" },
            { code: "AU", name: "Australia", dial: "+61", flag: "🇦🇺" },
            { code: "NZ", name: "New Zealand", dial: "+64", flag: "🇳🇿" },
            { code: "BR", name: "Brazil", dial: "+55", flag: "🇧🇷" },
            { code: "MX", name: "Mexico", dial: "+52", flag: "🇲🇽" },
            { code: "ZA", name: "South Africa", dial: "+27", flag: "🇿🇦" },
            { code: "NG", name: "Nigeria", dial: "+234", flag: "🇳🇬" },
          ];'''

          if 'const countries = [' not in text:
              text = text.replace('const features = [', countries + '\n\nconst features = [', 1)

          if 'const [country, setCountry]' not in text:
              text = text.replace(
                  '  const [phone, setPhone] = useState("");\n',
                  '  const [phone, setPhone] = useState("");\n  const [country, setCountry] = useState(countries.find((item) => item.code === "TR") ?? countries[0]);\n',
                  1,
              )

          send_code = '''  async function sendCode(event:React.FormEvent){ event.preventDefault(); setError(""); const local=phone.replace(/\\D/g,""); const normalized=normalizePhone(country.dial+local); if(!/^\\+[1-9]\\d{7,14}$/.test(normalized)){setError("اكتب رقم الهاتف بالشكل الصحيح.");return;} setBusy(true); try{confirmation.current=await signInWithPhoneNumber(auth,normalized,setupRecaptcha());setPhone(local);setStep("code");}catch(err){console.error(err);setError("تعذر إرسال رمز التحقق. تحقق من إعدادات Firebase ونطاق الموقع.");window.recaptchaVerifier?.clear();window.recaptchaVerifier=undefined;}finally{setBusy(false);} }'''
          text, count = re.subn(r'  async function sendCode\(event:React\.FormEvent\)\{.*?\n  \}', send_code, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('sendCode replacement failed')

          old_label = '<label><span>رقم الهاتف</span><input dir="ltr" type="tel" inputMode="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+90 5XX XXX XX XX" autoComplete="tel" required/></label>'
          new_label = '''<label><span>رقم الهاتف</span><div className="phone-picker"><select aria-label="الدولة" value={country.code} onChange={(e)=>setCountry(countries.find((item)=>item.code===e.target.value)??countries[0])}>{countries.map((item)=><option key={item.code} value={item.code}>{item.flag} {item.name} ({item.dial})</option>)}</select><input dir="ltr" type="tel" inputMode="tel" value={phone} onChange={e=>setPhone(e.target.value.replace(/\\D/g,""))} placeholder="5XX XXX XX XX" autoComplete="tel" required/></div></label>'''
          if old_label not in text:
              raise SystemExit('phone label not found')
          text = text.replace(old_label, new_label, 1)
          path.write_text(text, encoding='utf-8')

          css_path = Path('app/white-theme.css')
          css = css_path.read_text(encoding='utf-8')
          if '.phone-picker{' not in css:
              css += '''\n.phone-picker{display:grid;grid-template-columns:minmax(190px,.9fr) 1.1fr;gap:8px;direction:ltr}.phone-picker select{width:100%;padding:13px 12px;border-radius:14px;border:1px solid #dfe6e3;background:#f7faf8;color:#15211e;font-weight:700;cursor:pointer}.phone-picker input{min-width:0!important;padding-right:14px!important}.auth-form label:has(.phone-picker)::after{display:none!important}@media(max-width:560px){.phone-picker{grid-template-columns:1fr}}\n'''
              css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit live fix
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/page.tsx app/white-theme.css
          git rm .github/workflows/patch-phone-ui.yml
          git commit -m "feat: real WhatsApp-style country picker [skip-phone-ui]" || exit 0
          git push
